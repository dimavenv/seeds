# Запуск магазина на VPS. Инструкция — SETUP-VPS-RU.md.
#
# Перед запуском создайте рядом файл .env (по образцу .env.local.example):
# Docker Compose сам подставит из него NEXT_PUBLIC_* в сборку и передаст
# серверные секреты (SUPABASE_SERVICE_ROLE_KEY и т.д.) в контейнер.
#
#   docker compose up -d --build     # собрать и запустить
#   docker compose logs -f web      # смотреть логи
#
# Этап 2 (перенос базы данных на этот же сервер) добавит сюда сервис postgres —
# структура файла уже рассчитана на это.

services:
  web:
    build:
      context: .
      args:
        NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL:-}
        NEXT_PUBLIC_SUPABASE_ANON_KEY: ${NEXT_PUBLIC_SUPABASE_ANON_KEY:-}
        NEXT_PUBLIC_DADATA_TOKEN: ${NEXT_PUBLIC_DADATA_TOKEN:-}
    env_file: .env
    restart: unless-stopped
    # Порт открыт только для самого сервера (127.0.0.1) — наружу трафик
    # выпускает nginx по 80/443 (см. deploy/nginx.conf).
    ports:
      - "127.0.0.1:3000:3000"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
