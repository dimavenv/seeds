# nginx для tomatsemena.ru: обратный прокси к Next.js (pm2, 127.0.0.1:3000).
# Установка — SETUP-VPS-RU.md, шаг 8. Кратко:
#   sudo cp deploy/nginx.conf /etc/nginx/sites-available/tomatsemena
#   sudo ln -s /etc/nginx/sites-available/tomatsemena /etc/nginx/sites-enabled/
#   sudo rm -f /etc/nginx/sites-enabled/default
#   sudo nginx -t && sudo systemctl reload nginx
#
# После получения TLS-сертификата (платный DV у РФ-поставщика, см. шаг 9):
# положите fullchain.pem и privkey.pem в /etc/ssl/tomatsemena/, раскомментируйте
# блок «HTTPS» и строку redirect в блоке «HTTP», снова nginx -t && reload.

server {
    listen 80;
    server_name tomatsemena.ru www.tomatsemena.ru;

    # ➜ Раскомментируйте после установки сертификата (и удалите location / ниже):
    # return 301 https://$host$request_uri;

    client_max_body_size 20m;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}

