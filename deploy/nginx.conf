# Конфиг nginx для магазина (обратный прокси к контейнеру на 127.0.0.1:3000).
#
# Установка (подробно — SETUP-VPS-RU.md, шаг 8):
#   1. Замените ВЕЗДЕ shop.example.ru на свой домен.
#   2. sudo cp deploy/nginx.conf /etc/nginx/sites-available/shop
#   3. sudo ln -s /etc/nginx/sites-available/shop /etc/nginx/sites-enabled/
#   4. sudo nginx -t && sudo systemctl reload nginx
#   5. HTTPS: sudo certbot --nginx -d shop.example.ru
#      (certbot сам допишет в этот файл ssl-настройки и редирект на https)

server {
    listen 80;
    server_name shop.example.ru;

    # Фото в админке загружаются в Supabase Storage напрямую из браузера,
    # но запас на формы/куки не помешает.
    client_max_body_size 20m;

    # Сжатие текстовых ответов
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 60s;
    }

    # Статика Next.js — можно кэшировать надолго (имена файлов содержат хэш)
    location /_next/static/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
}
