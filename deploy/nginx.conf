# nginx для tomatsemena.ru — боевой конфиг (HTTPS + сайт + база на одном домене).
# Сайт (Next.js, pm2) на 127.0.0.1:3000, база (PocketBase) на 127.0.0.1:8090
# отдаётся по пути /pb — так один сертификат покрывает и сайт, и базу, и второй
# поддомен/сертификат не нужен.
#
# Установка: SETUP-DB-RU.md, шаг 10. Кратко:
#   sudo cp deploy/nginx.conf /etc/nginx/sites-available/tomatsemena
#   sudo ln -s /etc/nginx/sites-available/tomatsemena /etc/nginx/sites-enabled/
#   sudo rm -f /etc/nginx/sites-enabled/default
#   sudo nginx -t && sudo systemctl reload nginx
#
# Файлы сертификата (reg.ru DomainSSL) лежат в /etc/ssl/tomatsemena/:
#   fullchain.pem = certificate.crt + chain.crt, privkey.pem = приватный ключ.

server {
    listen 80;
    server_name tomatsemena.ru www.tomatsemena.ru;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name tomatsemena.ru www.tomatsemena.ru;

    ssl_certificate     /etc/ssl/tomatsemena/fullchain.pem;
    ssl_certificate_key /etc/ssl/tomatsemena/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    client_max_body_size 20m;
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Базовые security-заголовки
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Strict-Transport-Security "max-age=15552000" always;

    # Админка PocketBase НЕ должна быть доступна из интернета.
    # Для входа в неё используйте SSH-туннель:
    #   ssh -L 8090:127.0.0.1:8090 dima@СЕРВЕР  →  http://127.0.0.1:8090/_/
    location /pb/_/ {
        return 404;
    }

    # База PocketBase на том же домене — путь /pb/
    location /pb/ {
        proxy_pass http://127.0.0.1:8090/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Сайт (Next.js)
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 60s;
    }
}
