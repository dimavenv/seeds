# nginx для tomatsemena.ru — боевой конфиг (HTTPS + сайт + база на одном домене).
# Сайт (Next.js, pm2) на 127.0.0.1:3000, база (PocketBase) на 127.0.0.1:8090
# отдаётся по пути /pb — так один сертификат покрывает и сайт, и базу, и второй
# поддомен/сертификат не нужен.
#
# Установка: SETUP-DB-RU.md, шаг 10. Кратко:
#   sudo cp deploy/nginx.conf /etc/nginx/sites-available/tomatsemena
#   sudo ln -s /etc/nginx/sites-available/tomatsemena /etc/nginx/sites-enabled/
#   sudo rm -f /etc/nginx/sites-enabled/default
#   sudo nginx -t && sudo systemctl reload nginx
#
# Файлы сертификата (reg.ru DomainSSL) лежат в /etc/ssl/tomatsemena/:
#   fullchain.pem = certificate.crt + chain.crt, privkey.pem = приватный ключ.

# Зоны ограничения частоты (per-IP). Ключ — $binary_remote_addr (реальный
# адрес клиента на edge-nginx). Дорогие эндпоинты выносим в отдельные зоны.
# Директивы limit_req_zone живут в http-контексте: файл подключается из
# http{} через sites-enabled, поэтому объявляем их здесь, до server{}.
limit_req_zone $binary_remote_addr zone=api_checkout:10m rate=30r/m;
limit_req_zone $binary_remote_addr zone=api_auth:10m rate=60r/m;
limit_req_zone $binary_remote_addr zone=api_general:10m rate=120r/m;
# Вход напрямую в базу. Отдельная зона и намеренно жёсткая: этот путь минует
# и капчу, и лимитеры сайта — см. комментарий у location ниже.
limit_req_zone $binary_remote_addr zone=pb_auth:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=pb_general:10m rate=300r/m;
# Фото товаров. Их на странице каталога десятки, и открываются они пачкой —
# лимит для API здесь означал бы 429 на картинках у обычного покупателя.
limit_req_zone $binary_remote_addr zone=pb_files:10m rate=1200r/m;

server {
    listen 80;
    server_name tomatsemena.ru www.tomatsemena.ru;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name tomatsemena.ru www.tomatsemena.ru;

    ssl_certificate     /etc/ssl/tomatsemena/fullchain.pem;
    ssl_certificate_key /etc/ssl/tomatsemena/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    client_max_body_size 20m;
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Базовые security-заголовки
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
    add_header Permissions-Policy "geolocation=(), camera=(), microphone=()" always;
    # Полную CSP (script-src/connect-src/frame-src/form-action и остальное)
    # отдаёт приложение — она собирается из окружения, см. next.config.mjs.
    # Здесь остаётся короткая подстраховка на случай, когда ответ формирует сам
    # nginx и до Next запрос не дошёл: страницы ошибок 502/504, статика.
    # Браузер применяет оба заголовка сразу, ограничения складываются — этот
    # набор ничего не ослабляет.
    add_header Content-Security-Policy "frame-ancestors 'none'; object-src 'none'; base-uri 'self'" always;

    # Точки/скрытые файлы (.git, .env, .htaccess) и карты исходников — наружу
    # не отдаём. .git/config и .env постоянно сканируют боты.
    location ~ /\.(?!well-known) { deny all; }
    location ~* \.map$ { deny all; }

    # Админка PocketBase НЕ должна быть доступна из интернета.
    # Для входа в неё используйте SSH-туннель:
    #   ssh -L 8090:127.0.0.1:8090 dima@СЕРВЕР  →  http://127.0.0.1:8090/_/
    location /pb/_/ {
        return 404;
    }

    # Вход СУПЕРПОЛЬЗОВАТЕЛЯ базы — только с самого сервера.
    #
    # Это ключ от всей базы в обход правил доступа: получив его, можно читать и
    # менять что угодно. Из интернета такой адрес нужен только тому, кто
    # собирается круглосуточно перебирать пароль.
    #
    # Полностью закрыть нельзя: сайт обычно ходит в базу напрямую
    # (PB_INTERNAL_URL=http://127.0.0.1:8090), но если эта переменная не задана,
    # он пойдёт по публичному адресу — через nginx. Поэтому не «404 всем», а
    # «только с петлевого интерфейса»: свой сервер работает, интернет получает
    # 403. Настоящая админка PocketBase — только через SSH-туннель (см. выше).
    location ~ ^/pb/api/collections/_superusers/ {
        allow 127.0.0.1;
        allow ::1;
        deny all;
        rewrite ^/pb/(.*)$ /$1 break;
        proxy_pass http://127.0.0.1:8090;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Вход покупателя напрямую в базу.
    #
    # Свой /api/auth/login считает попытки, требует капчу и ограничен зоной
    # api_auth — но PocketBase отвечает на auth-with-password и сам, и этот
    # путь все перечисленные проверки минует. Без отдельного лимита перебор
    # паролей просто идёт мимо сайта.
    location ~ ^/pb/api/collections/[^/]+/auth-with-password {
        limit_req zone=pb_auth burst=5 nodelay;
        limit_req_status 429;
        # В location с регулярным выражением nginx запрещает URI в proxy_pass,
        # поэтому префикс /pb срезаем rewrite'ом — иначе база получила бы
        # запрос вида /pb/api/... и ответила 404.
        rewrite ^/pb/(.*)$ /$1 break;
        proxy_pass http://127.0.0.1:8090;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Фото товаров. Отдельно от остального /pb/ по двум причинам: их запрашивают
    # десятками сразу (общий лимит выдавал бы покупателю 429 вместо картинок),
    # и это статика, которую браузеру можно смело кэшировать надолго — имя файла
    # в PocketBase меняется при замене фото, так что устаревшую картинку он не
    # покажет.
    location ~ ^/pb/api/files/ {
        limit_req zone=pb_files burst=300 nodelay;
        limit_req_status 429;
        rewrite ^/pb/(.*)$ /$1 break;
        proxy_pass http://127.0.0.1:8090;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
        # add_header внутри location отменяет унаследованные — повторяем то,
        # что обязано быть на каждом ответе. CSP здесь своя и предельно узкая:
        # это чужой файл, и если он окажется не тем, чем притворялся, открыть
        # его как страницу всё равно не выйдет.
        add_header X-Content-Type-Options nosniff always;
        add_header Content-Security-Policy "default-src 'none'; sandbox" always;
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
    }

    # Остальная база на том же домене — путь /pb/: корзина, избранное, вход.
    location /pb/ {
        limit_req zone=pb_general burst=100 nodelay;
        limit_req_status 429;
        client_max_body_size 12m;   # чуть больше maxSize файла в media (10 МБ)
        proxy_pass http://127.0.0.1:8090/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Оформление заказа — самый дорогой путь (резерв склада, письма, банк).
    location = /api/checkout {
        limit_req zone=api_checkout burst=10 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Аутентификация, регистрация, сброс пароля, отправка кодов и заявки —
    # троттлим отдельно. Список должен покрывать ВСЕ роуты, которые проверяют
    # пароль, шлют письма или создают счета: иначе перебор и рассылка писем
    # получают общий бюджет /api/ (120 r/m), а это уже не ограничение.
    # Подсказки адреса (/api/dadata) сюда НЕ входят намеренно: они летят по
    # мере ввода, и общий бюджет /api/ им подходит больше, а свой потолок
    # (60/мин на IP) роут держит сам.
    location ~ ^/api/(auth/login|register|password-reset|login-guard|support|payment/retry) {
        limit_req zone=api_auth burst=20 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Остальные API (поиск, статус оплаты и т.п.) — общий бюджет.
    location /api/ {
        limit_req zone=api_general burst=40 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Сайт (Next.js)
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 60s;
    }
}
