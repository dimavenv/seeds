name: Перенос картинок Ozon → Supabase

# Запуск вручную из вкладки Actions (кнопка «Run workflow»).
# URL проекта Supabase вводится прямо в форме запуска (он не секретный).
# Service-ключ берётся из секрета репозитория SUPABASE_SERVICE_ROLE_KEY.
on:
  workflow_dispatch:
    inputs:
      supabase_url:
        description: "URL проекта Supabase, напр. https://xxxx.supabase.co"
        required: true

jobs:
  rehost:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm run import:ozon -- --rehost
        env:
          # URL — из поля запуска (приоритет), иначе из секрета/переменной.
          NEXT_PUBLIC_SUPABASE_URL: ${{ inputs.supabase_url || secrets.NEXT_PUBLIC_SUPABASE_URL || vars.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
