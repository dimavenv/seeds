version: 2
updates:
  # Обновления npm-зависимостей. Отдельно важны те, что участвуют в оплате и
  # шифровании: pocketbase, nodemailer, sharp, next.
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      # Мелкие обновления одной пачкой, чтобы не тонуть в PR-ах.
      patch-and-minor:
        update-types: ["minor", "patch"]
    labels: ["dependencies"]

  # Сами GitHub Actions тоже стареют и тоже бывают уязвимы.
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
    labels: ["dependencies"]
